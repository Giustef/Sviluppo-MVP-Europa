name: Demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check dist/app.js
      - run: node --check dist/demo-api.js
      - run: node tests/test_web.cjs
      - run: node tests/test_ui.cjs
      - run: python -m compileall -q server.py

